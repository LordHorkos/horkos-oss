name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: bash 3.2 read behaviour
        shell: /bin/bash {0}
        run: |
          bash --version | head -1
          printf '\xef\xbb\xbf\r\n\r\n  3.3.0\r\n' > f
          IFS="${IFS}"$'\r'
          read -n 1024 -d "" -r version rest <f || :
          echo "first read:"; declare -p version rest | od -c | head
          read -d "" -r v2 _ <<<"$rest"; echo "rc=$?"; declare -p v2
          set -f; set -- $rest; set +f; echo "split: [${1:-}]"

name: Tools

on:
  push:
    branches: [main]
    paths: ["tools/**", "src/**", "tests/**", "pyproject.toml", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", "src/**", "tests/**", "pyproject.toml", ".github/workflows/tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) no longer ships 3.9, so the 3.9 floor runs on 22.04
        include:
          - { os: ubuntu-22.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + pytest
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: python -m pytest -q

  scrubber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrubber tests
        working-directory: tools/scrubber
        run: python3 test_scrub.py
